name: ercot_west_solar_150mw
display_name: Example deal (schema demo)
counterparty_view: buyer          # buyer | seller
strike_usd_mwh: 34.50
contract_mw: 150
term: {start: 2023-01-01, end: 2025-12-31}
settlement_index: hub             # hub | node
hub: HB_WEST                      # ERCOT's actual DAM trading hub name
node: WESTSOLAR_ALL               # ILLUSTRATIVE ONLY -- not a real ERCOT node.
                                  # This file demonstrates the schema; see
                                  # lamesa_west / noble_north / sunvalley_central
                                  # for contracts on real assets with real nodes.
negative_price_floor: 0.0         # null = no floor
escalation_pct_yr: 0.0
project:
  lat: 31.85
  lon: -102.37
  dc_capacity_mw: 195             # ILR 1.30
  tilt_deg: 25
  azimuth_deg: 180
  losses_pct: 14
curtailment:                      # the plant declines to export at a loss
  curtail_below_usd_mwh: 0.0      # merchant: walks away at $0. A project on the
                                  # production tax credit would use ~-27.50,
                                  # which is much of why ERCOT goes negative.
