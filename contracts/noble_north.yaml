# Hypothetical VPPA written on a real asset: Noble Solar, Denton County TX.
# Plant identity, location and AC capacity are from EIA-860; the strike and
# contract terms are illustrative, not a real deal.
name: noble_solar_north
display_name: Noble Solar
counterparty_view: buyer
strike_usd_mwh: 32.00
contract_mw: 275
term: {start: 2023-01-01, end: 2025-12-31}
settlement_index: hub
hub: HB_NORTH
node: NOBLESLR_ALL
negative_price_floor: 0.0
escalation_pct_yr: 0.0
project:
  lat: 33.262
  lon: -97.238
  dc_capacity_mw: 357.5           # ILR 1.30
  tilt_deg: 28
  azimuth_deg: 180
  losses_pct: 14
  county: Denton
  state: TX
  eia_plant_id: 65271
  commercial_operation: 2022-09-01
storage:                          # Phase 4 overlay: 4-hour battery at ~25% of AC
  power_mw: 69
  duration_hours: 4
  round_trip_efficiency: 0.85
  cycling_cost_usd_mwh: 4.0       # amortised degradation per MWh discharged
curtailment:                      # the plant declines to export at a loss
  curtail_below_usd_mwh: 0.0      # merchant: walks away at $0. A project on the
                                  # production tax credit would use ~-27.50,
                                  # which is much of why ERCOT goes negative.
