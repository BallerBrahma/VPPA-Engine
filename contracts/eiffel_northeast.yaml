# Hypothetical VPPA written on a real asset: Eiffel Solar Project, Lamar
# County TX -- far northeast Texas, near the Oklahoma line and a long way from
# the West Texas solar cluster. Plant identity, location, AC capacity and
# commercial operation date are from EIA-860; the node is from ERCOT's
# resource-node registry. Strike and terms are illustrative.
#
# No storage block: this one is solar only, which is also what makes it the
# contract that shows what the storage tab looks like when there is nothing to
# dispatch.
name: eiffel_solar_northeast
display_name: Eiffel Solar Project
counterparty_view: buyer
strike_usd_mwh: 31.50
contract_mw: 240
term: {start: 2024-01-01, end: 2033-12-31}
settlement_index: node            # node-settled: the buyer takes the basis
hub: HB_NORTH
node: EIFSLR_UNIT1
negative_price_floor: 0.0
escalation_pct_yr: 0.0
project:
  lat: 33.599
  lon: -95.525
  dc_capacity_mw: 312.0           # ILR 1.30
  tilt_deg: 27
  azimuth_deg: 180
  losses_pct: 14
  tracking: single_axis_backtracked
  county: Lamar
  state: TX
  eia_plant_id: 66471
  commercial_operation: 2023-11-01
curtailment:                      # the plant declines to export at a loss
  curtail_below_usd_mwh: 0.0      # merchant: walks away at $0. A project on the
                                  # production tax credit would use ~-27.50,
                                  # which is much of why ERCOT goes negative.
